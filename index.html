  <!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login and Sign Up Page</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
  </head>

  <body class="auth-body">

    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">

          <div class="card auth-card shadow">
            <div class="card-body p-4 p-md-5">

              <div class="text-center mb-4">
                <h2>Welcome!</h2>
                <p class="text-muted">Log in or create an account</p>
              </div>

              <!-- LOGIN FORM -->
              <div id="login" class="form-box">
                <h4 class="mb-3">Log In</h4>

                <form action="landing.html" method="get">

                  <div class="mb-3">
                    <label for="user" class="form-label">Email or Username</label>
                    <input type="text" class="form-control" id="user" placeholder="Enter email or username">
                  </div>

                  <div class="mb-3">
                    <label for="pass" class="form-label">Password</label>
                    <input type="password" class="form-control" id="pass" placeholder="Enter password">
                  </div>

                  <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="remember">
                    <label class="form-check-label" for="remember">Remember me</label>
                  </div>

                  <a href="landing.html" class="btn btn-main w-100 mb-3">Log In</a>

                </form>

                <p class="text-center mb-0">
                  Don't have an account?
                  <a href="#signup" class="switch-link">Sign up here</a>
                </p>
              </div>

          
              <div id="signup" class="form-box">
                <h4 class="mb-3">Create an Account</h4>

                <form action="landing.html" method="get">

                  <div class="row">
                    <div class="col-md-6 mb-3">
                      <label for="fname" class="form-label">First Name</label>
                      <input type="text" class="form-control" id="fname" placeholder="First name">
                    </div>
                    <div class="col-md-6 mb-3">
                      <label for="lname" class="form-label">Last Name</label>
                      <input type="text" class="form-control" id="lname" placeholder="Last name">
                    </div>
                  </div>

                  <div class="mb-3">
                    <label for="gender" class="form-label">Gender</label>
                    <select class="form-select" id="gender">
                      <option selected>Select gender</option>
                      <option>Female</option>
                      <option>Male</option>
                      <option>Other</option>
                      <option>Prefer not to say</option>
                    </select>
                  </div>

                  <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" placeholder="Enter email">
                  </div>

                  <div class="row">
                    <div class="col-md-6 mb-3">
                      <label for="pass1" class="form-label">Password</label>
                      <input type="password" class="form-control" id="pass1" placeholder="Password">
                    </div>
                    <div class="col-md-6 mb-3">
                      <label for="pass2" class="form-label">Confirm Password</label>
                      <input type="password" class="form-control" id="pass2" placeholder="Confirm password">
                    </div>
                  </div>

                  <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="terms">
                    <label class="form-check-label" for="terms">
                      I agree to the Terms and Conditions
                    </label>
                  </div>

                  <button type="submit" class="btn btn-main w-100 mb-3">Sign Up</button>

                </form>

                <p class="text-center mb-0">
                  Already have an account?
                  <a href="#login" class="switch-link">Log in here</a>
                </p>
              </div>

            </div>
          </div>

        </div>
      </div>
    </div>

  </body>
  </html>
